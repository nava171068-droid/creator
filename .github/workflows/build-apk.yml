name: Build Creator Voice APK

on:
  push:
    paths:
      - "creator-voice-app.zip"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the app
        run: |
          rm -rf work && mkdir work
          unzip -q -o creator-voice-app.zip -d work
          SETTINGS=$(find work -name settings.gradle.kts | head -1)
          echo "APP_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: CreatorVoice-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
